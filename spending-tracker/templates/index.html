<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SpendTrack</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2a2d35">
  <link rel="apple-touch-icon" href="/static/icon-180.png" sizes="180x180">
  <link rel="stylesheet" href="/static/style.css?v=1">
  <script defer src="/static/chart.min.js"></script>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="app-title">💳 SpendTrack</div>
      <form method="POST" action="/logout"><button type="submit" class="btn-logout">⏻</button></form>
    </div>
  </header>

  <main id="main">

    <!-- Summary bar -->
    <section class="summary-bar">
      <div class="summary-card">
        <div class="summary-label">This Month</div>
        <div class="summary-value" id="sum-this-month">—</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">vs Last Month</div>
        <div class="summary-value" id="sum-vs-last">—</div>
      </div>
      <div class="summary-card" id="sum-uncat-card">
        <div class="summary-label">To Review</div>
        <div class="summary-value" id="sum-uncat">—</div>
      </div>
    </section>

    <!-- Upload -->
    <section class="log-section">
      <h3>Upload Statement</h3>
      <div class="upload-row">
        <select id="upload-account"></select>
        <button type="button" class="btn-outline" id="btn-new-account">+ Account</button>
      </div>
      <div id="new-account-form" class="new-account-form hidden">
        <input type="text" id="new-account-name" placeholder="Account name (e.g. Chase Checking)">
        <input type="text" id="new-account-institution" placeholder="Institution (optional)">
        <select id="new-account-type">
          <option value="credit_card">Credit Card</option>
          <option value="debit">Debit</option>
          <option value="checking">Checking</option>
          <option value="savings">Savings</option>
          <option value="other">Other</option>
        </select>
        <button type="button" class="btn-primary" id="btn-save-account">Save Account</button>
      </div>
      <div class="upload-row">
        <input type="file" id="upload-file" accept=".csv">
        <button type="button" class="btn-primary" id="btn-upload">Upload</button>
      </div>
    </section>

    <!-- Spend by category -->
    <section class="chart-card">
      <h3>Spend by Category</h3>
      <canvas id="chart-category"></canvas>
      <div id="category-legend" class="legend-list"></div>
    </section>

    <!-- Top merchants -->
    <section class="chart-card">
      <h3>Top Merchants</h3>
      <div id="top-merchants-list" class="merchant-list"></div>
    </section>

    <!-- Monthly trend -->
    <section class="chart-card">
      <h3>Monthly Trend</h3>
      <canvas id="chart-trend"></canvas>
    </section>

    <!-- Review queue -->
    <section class="log-section">
      <h3>Needs Review</h3>
      <div id="review-list" class="review-list"></div>
      <div id="review-empty" class="empty-hint hidden">All caught up 🎉</div>
    </section>

    <!-- All transactions -->
    <section class="log-section">
      <h3 class="collapsible-header" id="txn-toggle">All Transactions <span id="txn-toggle-icon">▾</span></h3>
      <div id="txn-list" class="txn-list hidden"></div>
    </section>

  </main>

  <!-- Column mapping modal -->
  <div class="modal-backdrop hidden" id="mapping-modal-backdrop">
    <div class="modal">
      <h3>Match Your Columns</h3>
      <p class="modal-hint">First upload for this account — confirm which columns are which.</p>
      <label>Date column<select id="map-date"></select></label>
      <label>Amount column<select id="map-amount"></select></label>
      <label>Merchant / Description column<select id="map-merchant"></select></label>
      <label>Sign convention
        <select id="map-sign">
          <option value="positive_is_debit">Spend shows as positive</option>
          <option value="negative_is_debit">Spend shows as negative</option>
        </select>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn-outline" id="mapping-cancel">Cancel</button>
        <button type="button" class="btn-primary" id="mapping-confirm">Confirm & Import</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').content;
    const _origFetch = window.fetch;
    window.fetch = function(url, opts) {
      opts = opts || {};
      if (opts.method && opts.method !== 'GET') {
        opts.headers = Object.assign({ 'X-CSRFToken': CSRF_TOKEN }, opts.headers || {});
      }
      return _origFetch.call(this, url, opts);
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    function fmtMoney(n) {
      return '$' + (n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    let accounts = [];
    let categories = [];
    let transactions = [];
    let charts = {};
    let pendingUpload = null; // { file, accountId } while mapping modal is open

    async function loadAll() {
      await Promise.all([loadCategories(), loadAccounts()]);
      await Promise.all([loadSummary(), loadTransactions()]);
    }

    async function loadCategories() {
      categories = await (await fetch('/categories')).json();
    }

    async function loadAccounts() {
      accounts = await (await fetch('/accounts')).json();
      const sel = document.getElementById('upload-account');
      sel.innerHTML = accounts.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')
        || '<option value="">No accounts yet — add one</option>';
    }

    async function loadSummary() {
      const s = await (await fetch('/api/summary')).json();
      document.getElementById('sum-this-month').textContent = fmtMoney(s.total_this_month);
      const vsLast = document.getElementById('sum-vs-last');
      if (s.pct_change === null) {
        vsLast.textContent = '—';
      } else {
        const arrow = s.pct_change > 0 ? '▲' : (s.pct_change < 0 ? '▼' : '—');
        vsLast.textContent = `${arrow} ${Math.abs(s.pct_change)}%`;
        vsLast.style.color = s.pct_change > 0 ? 'var(--red)' : 'var(--green)';
      }
      document.getElementById('sum-uncat').textContent = s.uncategorized_count;

      renderCategoryChart(s.by_category);
      renderTrendChart(s.monthly_trend);
      renderTopMerchants(s.top_merchants);
    }

    function renderCategoryChart(byCategory) {
      const ctx = document.getElementById('chart-category');
      const labels = byCategory.map(c => `${c.icon || ''} ${c.name}`);
      const data = byCategory.map(c => c.total);
      const colors = byCategory.map(c => c.color || '#5a6070');
      if (charts.category) {
        charts.category.data.labels = labels;
        charts.category.data.datasets[0].data = data;
        charts.category.data.datasets[0].backgroundColor = colors;
        charts.category.update();
      } else {
        charts.category = new Chart(ctx, {
          type: 'doughnut',
          data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
          options: { plugins: { legend: { display: false } }, cutout: '65%' },
        });
      }
      const legend = document.getElementById('category-legend');
      legend.innerHTML = byCategory.map(c => `
        <div class="legend-row">
          <span class="legend-dot" style="background:${c.color || '#5a6070'}"></span>
          <span class="legend-name">${c.icon || ''} ${esc(c.name)}</span>
          <span class="legend-value">${fmtMoney(c.total)}</span>
        </div>`).join('') || '<div class="empty-hint">No spending yet this month</div>';
    }

    function renderTrendChart(trend) {
      const ctx = document.getElementById('chart-trend');
      const labels = trend.map(t => t.month);
      const data = trend.map(t => t.total);
      if (charts.trend) {
        charts.trend.data.labels = labels;
        charts.trend.data.datasets[0].data = data;
        charts.trend.update();
      } else {
        charts.trend = new Chart(ctx, {
          type: 'bar',
          data: { labels, datasets: [{ data, backgroundColor: '#1478ff', borderRadius: 6 }] },
          options: {
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false }, ticks: { color: '#a8aeba' } },
              y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a8aeba' } },
            },
          },
        });
      }
    }

    function renderTopMerchants(merchants) {
      const list = document.getElementById('top-merchants-list');
      if (!merchants.length) {
        list.innerHTML = '<div class="empty-hint">No spending yet this month</div>';
        return;
      }
      const max = Math.max(...merchants.map(m => m.total));
      list.innerHTML = merchants.map(m => `
        <div class="merchant-row">
          <div class="merchant-info">
            <span class="merchant-name">${esc(m.merchant)}</span>
            <span class="merchant-count">${m.count}x</span>
          </div>
          <div class="merchant-bar-track"><div class="merchant-bar" style="width:${(m.total / max * 100).toFixed(0)}%"></div></div>
          <span class="merchant-total">${fmtMoney(m.total)}</span>
        </div>`).join('');
    }

    async function loadTransactions() {
      transactions = await (await fetch('/api/transactions?days=365')).json();
      renderReviewQueue();
      renderTxnList();
    }

    function categoryOptions(selectedId) {
      return categories.map(c =>
        `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.icon || ''} ${esc(c.name)}</option>`
      ).join('');
    }

    function renderReviewQueue() {
      const needsReview = transactions.filter(t => t.category_source === 'default');
      const list = document.getElementById('review-list');
      document.getElementById('review-empty').classList.toggle('hidden', needsReview.length > 0);
      list.innerHTML = needsReview.map(t => `
        <div class="review-item" data-id="${t.id}">
          <div class="review-info">
            <span class="review-merchant">${esc(t.merchant)}</span>
            <span class="review-meta">${t.date} · ${fmtMoney(t.amount)}</span>
          </div>
          <select class="review-category-select" data-id="${t.id}">${categoryOptions(t.category_id)}</select>
        </div>`).join('');
      list.querySelectorAll('.review-category-select').forEach(sel => {
        sel.addEventListener('change', onCategoryCorrect);
      });
    }

    function renderTxnList() {
      const list = document.getElementById('txn-list');
      list.innerHTML = transactions.map(t => `
        <div class="txn-row" data-id="${t.id}">
          <div class="txn-info">
            <span class="txn-merchant">${esc(t.merchant)}</span>
            <span class="txn-meta">${t.date} · ${t.category_icon || ''} ${esc(t.category_name || 'Uncategorized')}</span>
          </div>
          <span class="txn-amount">${fmtMoney(t.amount)}</span>
          <select class="txn-category-select" data-id="${t.id}">${categoryOptions(t.category_id)}</select>
          <button type="button" class="txn-delete" data-id="${t.id}">🗑</button>
        </div>`).join('');
      list.querySelectorAll('.txn-category-select').forEach(sel => sel.addEventListener('change', onCategoryCorrect));
      list.querySelectorAll('.txn-delete').forEach(btn => btn.addEventListener('click', onDeleteTransaction));
    }

    async function onCategoryCorrect(e) {
      const id = e.target.dataset.id;
      const categoryId = parseInt(e.target.value, 10);
      await fetch(`/transactions/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category_id: categoryId }),
      });
      showToast('Categorized — future matches will follow');
      await loadAll();
    }

    async function onDeleteTransaction(e) {
      const id = e.target.dataset.id;
      await fetch(`/transactions/${id}`, { method: 'DELETE' });
      await loadAll();
    }

    document.getElementById('btn-new-account').addEventListener('click', () => {
      document.getElementById('new-account-form').classList.toggle('hidden');
    });

    document.getElementById('btn-save-account').addEventListener('click', async () => {
      const name = document.getElementById('new-account-name').value.trim();
      if (!name) return showToast('Account name required');
      const res = await fetch('/accounts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          institution: document.getElementById('new-account-institution').value.trim(),
          account_type: document.getElementById('new-account-type').value,
        }),
      });
      if (res.ok) {
        showToast('Account added');
        document.getElementById('new-account-form').classList.add('hidden');
        document.getElementById('new-account-name').value = '';
        document.getElementById('new-account-institution').value = '';
        await loadAccounts();
      }
    });

    document.getElementById('btn-upload').addEventListener('click', async () => {
      const accountId = document.getElementById('upload-account').value;
      const fileInput = document.getElementById('upload-file');
      const file = fileInput.files[0];
      if (!accountId) return showToast('Add or select an account first');
      if (!file) return showToast('Choose a CSV file');

      const account = accounts.find(a => String(a.id) === String(accountId));
      pendingUpload = { file, accountId };

      if (account && account.has_mapping) {
        await doUpload(null);
      } else {
        const fd = new FormData();
        fd.append('file', file);
        const res = await fetch('/upload/sniff', { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) return showToast(data.error || 'Could not read file');
        openMappingModal(data);
      }
    });

    function openMappingModal(sniffData) {
      const headers = sniffData.headers;
      const opts = headers.map(h => `<option value="${esc(h)}">${esc(h)}</option>`).join('');
      document.getElementById('map-date').innerHTML = opts;
      document.getElementById('map-amount').innerHTML = opts;
      document.getElementById('map-merchant').innerHTML = opts;
      if (sniffData.guess.date) document.getElementById('map-date').value = sniffData.guess.date;
      if (sniffData.guess.amount) document.getElementById('map-amount').value = sniffData.guess.amount;
      if (sniffData.guess.merchant) document.getElementById('map-merchant').value = sniffData.guess.merchant;
      document.getElementById('mapping-modal-backdrop').classList.remove('hidden');
    }

    document.getElementById('mapping-cancel').addEventListener('click', () => {
      document.getElementById('mapping-modal-backdrop').classList.add('hidden');
      pendingUpload = null;
    });

    document.getElementById('mapping-confirm').addEventListener('click', async () => {
      const columnMapping = {
        date: document.getElementById('map-date').value,
        amount: document.getElementById('map-amount').value,
        merchant: document.getElementById('map-merchant').value,
        amount_sign: document.getElementById('map-sign').value,
      };
      document.getElementById('mapping-modal-backdrop').classList.add('hidden');
      await doUpload(columnMapping);
    });

    async function doUpload(columnMapping) {
      if (!pendingUpload) return;
      const fd = new FormData();
      fd.append('file', pendingUpload.file);
      fd.append('account_id', pendingUpload.accountId);
      if (columnMapping) fd.append('column_mapping', JSON.stringify(columnMapping));
      const res = await fetch('/upload', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) {
        showToast(data.error || 'Upload failed');
      } else {
        showToast(`Imported ${data.imported_count} · Skipped ${data.duplicate_count} duplicates`);
        document.getElementById('upload-file').value = '';
        await loadAll();
      }
      pendingUpload = null;
    }

    document.getElementById('txn-toggle').addEventListener('click', () => {
      const list = document.getElementById('txn-list');
      const icon = document.getElementById('txn-toggle-icon');
      list.classList.toggle('hidden');
      icon.textContent = list.classList.contains('hidden') ? '▾' : '▴';
    });

    function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    }

    loadAll();
  </script>
</body>
</html>
